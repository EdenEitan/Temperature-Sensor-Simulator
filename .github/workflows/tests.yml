name: C++ Unit Tests and Python Integration Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Ubuntu / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure C++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Compile C++ simulator and unit tests
        run: cmake --build build --parallel 2

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run Python integration and typed-driver tests
        run: python -m pytest -v --junitxml=pytest-results.xml
        env:
          DEVICE_BINARY: ${{ github.workspace }}/build/device_sim

      - name: Save pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-python-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: ignore
