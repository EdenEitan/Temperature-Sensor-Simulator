name: C++ Unit, Python Integration and Sanitizer Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Ubuntu / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure C++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Compile C++ simulator and unit tests
        run: cmake --build build --parallel 2

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run Python integration and typed-driver tests
        run: python -m pytest -v --junitxml=pytest-results.xml
        env:
          DEVICE_BINARY: ${{ github.workspace }}/build/device_sim

      - name: Save pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-python-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: ignore

  sanitizers:
    name: Ubuntu / Clang / ASan + UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure sanitizer-instrumented C++ build
        run: |
          cmake -S . -B build-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Compile instrumented C++ simulator and unit tests
        run: cmake --build build-sanitized --parallel 2

      - name: Run sanitizer-instrumented C++ unit tests
        run: |
          ctest --test-dir build-sanitized --output-on-failure \
            --output-junit "${GITHUB_WORKSPACE}/sanitizer-results.xml"

      - name: Upload sanitizer CTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-ctest-results
          path: sanitizer-results.xml
          if-no-files-found: warn
